<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบเวชระเบียน</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #111; overflow: hidden; }
    #app { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="app" allow="camera; microphone; fullscreen; clipboard-write" title="ระบบเวชระเบียน"></iframe>
  <script>
    var BASE = "https://script.google.com/macros/s/AKfycxzesSdQiNvw5bQ1hK4sRSjSknPljaAsgS-P8S3T9sDbVKGATL9YFo4TKhnRf682QMw6Mcg/exec";
    var frame = document.getElementById('app');
    
    function withShell(url) { return url + (url.indexOf('?') > -1 ? '&' : '?') + 'shell=1'; }
    
    var extra = location.search ? '&' + location.search.slice(1) : '';
    frame.src = BASE + '?shell=1' + extra;
    
    window.addEventListener('message', function (e) {
      var d = e.data || {};
      if (d.type === 'navigate' && d.url) {
        history.pushState(null, '', d.url);
        var q = d.url.indexOf('?') > -1 ? '&' + d.url.split('?')[1] : '';
        frame.src = BASE + '?shell=1' + q;
      }
    });
  </script>
</body>
</html>
